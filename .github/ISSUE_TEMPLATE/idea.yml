name: Idea
description: An improvement or a new feature for the plugin or the extension. (Issues in Portuguese are welcome too.)
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and where plan-relay gets in the way or does not help. Start with the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: How you would solve it. Alternatives you considered are welcome.
    validations:
      required: true
