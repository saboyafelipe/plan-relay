# Claude Code values for the {{AGENT_<KEY>}} markers of core/.
# tools/build.sh replaces each marker with the value from here in every package file and
# refuses to build if a marker has no value. One key per line, KEY=value, without quotes; the
# value carries no «|», «&» nor backslash. Lines with # and blank lines do not count.

# Prefix that invokes a project skill by name: /<name>.
AGENT_SKILL_PREFIX=/
# Prefix that invokes a skill of this plugin: /plan-relay:map. The name is the package's
# (plan-relay in English, plan-relay-pt-br in pt-BR): tools/build.sh fills {{PLUGIN_NAME}} after this.
AGENT_PLUGIN_SKILL_PREFIX=/{{PLUGIN_NAME}}:
# Structured question tool for the user.
AGENT_ASK_TOOL=AskUserQuestion
# Project skills folder, from the repository root.
AGENT_PROJECT_SKILLS_DIR=.claude/skills
# Model of each task tier (Tier:), in the model parameter of the worker launch.
# An agent without a model choice puts the same value in all three.
AGENT_TIER_JUNIOR=haiku
AGENT_TIER_MID=sonnet
AGENT_TIER_SENIOR=opus
